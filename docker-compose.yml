services:
  solr:
    image: solr:9
    container_name: search-solr
    ports:
      - "8983:8983"
    environment:
      - SOLR_HEAP=512m
    volumes:
      - solr_data:/var/solr
    command: solr-precreate documents

  ollama:
    image: ollama/ollama:latest
    container_name: search-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  solr_data:
  ollama_data: